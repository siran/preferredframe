one_sentence_summary: Dimension and space emerge from causal distances inside a single stable Node, via approximate metric embeddings.
abstract: 'We extend a previously introduced framework in which time and distance arise from internal causal relations within a single stable Node. In this work we clarify that no metric, geometric structure, or fixed dimensionality is assumed at the fundamental level. The Node is an abstract collection of subnodes linked by causal influence, and any notion of "space" arises only from the distances induced by causal chains. We show that observers may assign an effective spatial dimension whenever these causal distances can be approximately embedded into a D-dimensional space with low distortion. Crucially, no particular dimension D is preferred or fundamental: the same causal structure may support multiple effective dimensional interpretations, and the true underlying dimensionality is undefined. This liberates spatial dimension from preconceived geometric constraints and treats it as an emergent, observer-dependent property of causal relations rather than a fixed feature of spacetime.'
