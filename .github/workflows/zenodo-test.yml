name: PNPMD Zenodo Test

on:
  workflow_dispatch:
    inputs:
      mdfile:
        description: "Path to local .md to submit"
        required: true
        default: "preferredframe/prints/example.md"

jobs:
  zenodo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Submit file and create Zenodo deposition
        env:
          ZENODO_API: ${{ secrets.ZENODO_API }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python .scripts/src/submit_and_zenodo.py "${{ github.event.inputs.mdfile }}"
