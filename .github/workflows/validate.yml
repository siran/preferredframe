name: validate

on:
  push:
    branches-ignore: [ main ]
    paths:
      - 'preferredframe/prints/**/*.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'preferredframe/prints/**/*.md'

jobs:
  validate:
    if: ${{ github.repository_owner == 'preferredframe' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pandoc + crossref + minimal TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc pandoc-crossref texlive-xetex texlive-fonts-recommended texlive-plain-generic

      - name: Validate PNPMD (build pnp.md/html/pdf)
        run: |
          python ./.scripts/src/validate_pnpmd.py

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validator-outputs
          path: |
            preferredframe/prints/**/*.pnp.md
            preferredframe/prints/**/*.html
            preferredframe/prints/**/*.pdf
          if-no-files-found: warn
