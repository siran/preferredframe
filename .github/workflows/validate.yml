name: validate

on:
  push:
    branches-ignore: [ main ]
    paths:
      - 'prints/**/*.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'prints/**/*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: validate
        name: Build pnpmd/html/pdf (docker pandoc)
        run: |
          python ./.scripts/src/validate_pnpmd.py

      - name: Upload folder as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validator-${{ github.head_ref || github.run_id }}
          path: ${{ steps.validate.outputs.artifact_path }}
          if-no-files-found: error
