name: PNPMD Validate & Preview (PR)

on:
  pull_request:
    paths:
      - 'preferredframe/prints/**/*.md'

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    container:
      image: pandoc/latex:latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install pandoc-crossref (single binary)
        run: |
          set -e
          VER=0.3.17.0
          wget -q https://github.com/lierdakil/pandoc-crossref/releases/download/v$VER/pandoc-crossref-Linux.tar.xz
          tar -xJf pandoc-crossref-Linux.tar.xz
          install -m 0755 pandoc-crossref /usr/local/bin/pandoc-crossref
          pandoc-crossref --version

      - name: Locate exactly one changed Markdown file
        id: pick
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- 'preferredframe/prints/**/*.md' ':!**/README.md' || true)
          COUNT=$(printf "%s\n" "$FILES" | sed '/^\s*$/d' | wc -l)
          echo "Changed PNPMD files:"; printf "%s\n" "$FILES"
          [ "$COUNT" -eq 1 ] || { echo "Exactly one .md must be changed in the PR (got $COUNT)."; exit 1; }
          MD="$FILES"
          echo "md=$MD"                 >> $GITHUB_OUTPUT
          echo "pnpmd=${MD%.md}.pnpmd.md"  >> $GITHUB_OUTPUT
          echo "md_html=${MD%.md}.md.html" >> $GITHUB_OUTPUT
          echo "html=${MD%.md}.html"       >> $GITHUB_OUTPUT

      - name: Validate PNPMD
        run: python .scripts/src/validate_pnpmd.py "${{ steps.pick.outputs.md }}"

      - name: Generate PNPMD normalized file
        run: python .scripts/src/make_pnpmd.py "${{ steps.pick.outputs.md }}" "${{ steps.pick.outputs.pnpmd }}"

      - name: Render md.html (from original .md)
        run: python .scripts/src/make_html.py "${{ steps.pick.outputs.md }}" "${{ steps.pick.outputs.md_html }}"

      - name: Render html (from .pnpmd.md)
        run: python .scripts/src/make_html.py "${{ steps.pick.outputs.pnpmd }}" "${{ steps.pick.outputs.html }}"

      - name: DOI manifest (primary = original MD)
        run: |
          cat > doi_candidates.json <<JSON
          {
            "primary_md": "${{ steps.pick.outputs.md }}",
            "normalized_pnpmd": "${{ steps.pick.outputs.pnpmd }}",
            "review_html_from_md": "${{ steps.pick.outputs.md_html }}",
            "review_html_from_pnpmd": "${{ steps.pick.outputs.html }}"
          }
          JSON
          cat doi_candidates.json

      - name: Upload PR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pnpmd-preview
          path: |
            ${{ steps.pick.outputs.pnpmd }}
            ${{ steps.pick.outputs.md_html }}
            ${{ steps.pick.outputs.html }}
            doi_candidates.json
