name: PNPMD PR Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    # If you use a container, add it here; we install git inside it as well.
    steps:
      - name: Install git (works on Ubuntu/Alpine/RHEL runners/containers)
        shell: bash
        run: |
          set -e
          if command -v git >/dev/null 2>&1; then
            git --version
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y || true
            sudo apt-get install -y git
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache git
          elif command -v yum >/dev/null 2>&1; then
            sudo yum install -y git
          else
            echo "git missing and no known package manager"; exit 1
          fi
          git --version

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PNPMD change set
        shell: bash
        run: |
          set -euo pipefail

          # Robust base/head shas for PRs (forks included)
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Diff: $BASE_SHA...$HEAD_SHA"

          # Disable C-quoting and get NUL-separated list to preserve UTF-8
          CHANGED=$(git -c core.quotepath=false diff --name-only -z "$BASE_SHA...$HEAD_SHA" || true)

          echo "Changed files:"
          printf '%s' "$CHANGED" | tr '\0' '\n' | sed '/^$/d'
          echo

          # Count only *.md under preferredframe/prints/**
          MD_CHANGED=$(printf '%s' "$CHANGED" | tr '\0' '\n' | grep -E '^preferredframe/prints/.+\.md$' || true)
          MD_COUNT=$(printf '%s\n' "$MD_CHANGED" | sed '/^\s*$/d' | wc -l | tr -d ' ')

          echo "Changed PNPMD .md files:"
          printf '%s\n' "$MD_CHANGED" | sed '/^\s*$/d' || true
          echo "Count: $MD_COUNT"

          if [ "$MD_COUNT" -ne 1 ]; then
            echo "Exactly one .md must be changed in the PR (got $MD_COUNT)."
            exit 1
          fi

          # .yml sidecar changes are fine; nothing else is enforced here.
