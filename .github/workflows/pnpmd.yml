# .github/workflows/pnpmd.yml
name: PNPMD PR Check
on:
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    # if you use a container, keep it; we install git inside it
    # container: ghcr.io/your/image:tag
    steps:
      - name: Install git in runner/container
        shell: bash
        run: |
          set -e
          if command -v git >/dev/null 2>&1; then
            git --version; exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y || true
            sudo apt-get install -y git
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache git
          elif command -v yum >/dev/null 2>&1; then
            sudo yum install -y git
          else
            echo "git missing and no known package manager"; exit 1
          fi
          git --version

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PNPMD change set
        shell: bash
        run: |
          set -euo pipefail
          # Robust base/head for PRs (forks included)
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Diff: $BASE_SHA...$HEAD_SHA"
          CHANGED="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" || true)"
          echo "Changed files:"
          echo "$CHANGED"
          echo

          PNPMD_CHANGED="$(echo "$CHANGED" | grep -E '^preferredframe/prints/.+\.md$' || true)"
          PNPMD_COUNT="$(echo "$PNPMD_CHANGED" | sed '/^\s*$/d' | wc -l | tr -d ' ')"

          echo "Changed PNPMD .md files:"
          echo "$PNPMD_CHANGED"
          echo "Count: $PNPMD_COUNT"

          if [ "$PNPMD_COUNT" -ne 1 ]; then
            echo "Exactly one .md must be changed in the PR (got $PNPMD_COUNT)."
            exit 1
          fi
