name: PNPMD PR Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure git present
        shell: bash
        run: |
          set -e
          command -v git || { sudo apt-get update -y && sudo apt-get install -y git; }
          git --version

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate: exactly one .md under preferredframe/prints/**
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python .scripts/src/print_pipeline.py --pr-check
