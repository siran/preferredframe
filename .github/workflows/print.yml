name: PNPMD to Zenodo (push)

on:
  push:
    paths:
      - "preferredframe/prints/**/*.md"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: pandoc/latex:latest
    permissions:
      contents: read
    env:
      ZENODO_API: https://sandbox.zenodo.org/api   # switch to production when ready
      BASE_URL: https://preferredframe.com

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure git in container
        shell: bash
        run: |
          set -e
          if ! command -v git >/dev/null 2>&1; then
            apt-get update -y
            apt-get install -y git
          fi
          git --version

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Install pandoc-crossref
        shell: bash
        run: |
          set -e
          VER=0.3.17.0
          curl -fsSL -o xref.tar.xz "https://github.com/lierdakil/pandoc-crossref/releases/download/v$VER/pandoc-crossref-Linux.tar.xz"
          tar -xJf xref.tar.xz
          install -m 0755 pandoc-crossref /usr/local/bin/pandoc-crossref
          pandoc-crossref --version

      - name: Run print pipeline
        env:
          # GitHub-provided refs for push
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BEFORE:     ${{ github.event.before }}
          GITHUB_AFTER:      ${{ github.sha }}
          # Secrets
          ASSETS_PAT:        ${{ secrets.ASSETS_PAT }}
          ZENODO_TOKEN:      ${{ secrets.ZENODO_TOKEN }}
          # Config
          ZENODO_API:        ${{ env.ZENODO_API }}
          BASE_URL:          ${{ env.BASE_URL }}
        run: |
          python .scripts/src/print_pipeline.py
