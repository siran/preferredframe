name: print

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]
    paths:
      - 'preferredframe/prints/**/*.md'

jobs:
  print:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - id: print
        name: Build, verify, sidecar, commit, push (docker pandoc)
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_SHA: ${{ github.sha }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          python ./.scripts/src/print_pipeline.py

      - name: Upload print folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-${{ github.head_ref || github.run_id }}
          path: ${{ steps.print.outputs.artifact_path }}
          if-no-files-found: error
