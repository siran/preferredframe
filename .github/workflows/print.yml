name: PNPMD to Zenodo (push)

on:
  push:
    paths:
      - "preferredframe/prints/**/*.md"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: pandoc/latex:latest
    defaults:
      run:
        shell: sh  # container may not have bash
    permissions:
      contents: read
    env:
      ZENODO_API: https://sandbox.zenodo.org/api
      BASE_URL: https://preferredframe.com

    steps:
      - name: Ensure git (and curl) in container BEFORE checkout
        run: |
          set -eu
          if command -v git >/dev/null 2>&1; then
            git --version
          else
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -y
              apt-get install -y git curl
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache git curl
            elif command -v microdnf >/dev/null 2>&1; then
              microdnf install -y git curl
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y git curl
            elif command -v yum >/dev/null 2>&1; then
              yum install -y git curl
            elif command -v zypper >/dev/null 2>&1; then
              zypper --non-interactive install git curl
            else
              echo "No supported package manager found to install git." >&2
              exit 1
            fi
            git --version
          fi

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          set -eu
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Install pandoc-crossref
        run: |
          set -eu
          VER=0.3.17.0
          curl -fsSL -o xref.tar.xz "https://github.com/lierdakil/pandoc-crossref/releases/download/v$VER/pandoc-crossref-Linux.tar.xz"
          tar -xJf xref.tar.xz
          install -m 0755 pandoc-crossref /usr/local/bin/pandoc-crossref
          pandoc-crossref --version

      - name: Run print pipeline (push → build → Zenodo)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BEFORE:     ${{ github.event.before }}
          GITHUB_AFTER:      ${{ github.sha }}
          ASSETS_PAT:        ${{ secrets.ASSETS_PAT }}
          ZENODO_TOKEN:      ${{ secrets.ZENODO_TOKEN }}
          ZENODO_API:        ${{ env.ZENODO_API }}
          BASE_URL:          ${{ env.BASE_URL }}
        run: |
          set -eu
          python .scripts/src/print_pipeline.py
