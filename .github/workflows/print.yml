name: PNPMD → Zenodo (push)

on:
  push:
    paths:
      - 'preferredframe/prints/**/*.md'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: pandoc/latex:latest
    permissions:
      contents: read
    env:
      ZENODO_API: https://sandbox.zenodo.org/api   # switch to production when ready
      BASE_URL:   https://preferredframe.com
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install Python deps
        run: python -m pip install --upgrade pip requests pyyaml

      - name: Install pandoc-crossref
        run: |
          set -e
          VER=0.3.17.0
          wget -q https://github.com/lierdakil/pandoc-crossref/releases/download/v$VER/pandoc-crossref-Linux.tar.xz
          tar -xJf pandoc-crossref-Linux.tar.xz
          install -m 0755 pandoc-crossref /usr/local/bin/pandoc-crossref
          pandoc-crossref --version

      - name: Ensure required secrets
        env:
          ASSETS_PAT:   ${{ secrets.ASSETS_PAT }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          [ -n "${ASSETS_PAT}" ]   || { echo "ASSETS_PAT missing"; exit 1; }
          [ -n "${ZENODO_TOKEN}" ] || { echo "ZENODO_TOKEN missing"; exit 1; }

      - name: Locate exactly one changed Markdown file (push)
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
          AFTER:  ${{ github.sha }}
        run: |
          set -e
          FILES=$(git diff --name-only --diff-filter=ACMRT "$BEFORE" "$AFTER" -- 'preferredframe/prints/**/*.md' ':!**/README.md' || true)
          COUNT=$(printf "%s\n" "$FILES" | sed '/^\s*$/d' | wc -l)
          echo "Changed MD files:"; printf "%s\n" "$FILES"
          [ "$COUNT" -eq 1 ] || { echo "Exactly one .md must change per push (got $COUNT)."; exit 1; }
          MD="$FILES"
          echo "md=$MD"                   >> $GITHUB_OUTPUT
          echo "pdf=${MD%.md}.pdf"        >> $GITHUB_OUTPUT
          echo "pnp_md=${MD%.md}.pnp.md"  >> $GITHUB_OUTPUT
          echo "html=${MD%.md}.html"      >> $GITHUB_OUTPUT

      - name: Validate PNPMD
        run: python .scripts/src/validate_pnpmd.py "${{ steps.pick.outputs.md }}"

      - name: Build PDF (auxiliary)
        run: python .scripts/src/make_pdf.py "${{ steps.pick.outputs.md }}" "${{ steps.pick.outputs.pdf }}"

      - name: Build PNPMD normalized file (.pnp.md)
        run: python .scripts/src/make_pnpmd.py "${{ steps.pick.outputs.md }}" "${{ steps.pick.outputs.pnp_md }}"

      - name: Build HTML (auxiliary, from .pnp.md)
        run: python .scripts/src/make_html.py "${{ steps.pick.outputs.pnp_md }}" "${{ steps.pick.outputs.html }}"

      - name: Publish to Zenodo (PRIMARY = MD; attach PNP/HTML/PDF)
        id: zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_API:   ${{ env.ZENODO_API }}
        run: |
          OUT=$(python .scripts/src/zenodo_publish.py \
            --primary "${{ steps.pick.outputs.md }}" \
            --attach  "${{ steps.pick.outputs.pnp_md }}" \
            --attach  "${{ steps.pick.outputs.html }}" \
            --attach  "${{ steps.pick.outputs.pdf }}" \
            --title "$(python - <<'PY'
from pathlib import Path
p=Path(r"""${{ steps.pick.outputs.md }}""")
with p.open("r", encoding="utf-8") as f:
    first=f.readline().strip()
print(first[2:].strip() if first.startswith("% ") else p.stem)
PY
)")
          echo "$OUT"
          echo "concept_doi=$(echo "$OUT" | python -c 'import sys,json; print(json.load(sys.stdin)["concept_doi"])')" >> $GITHUB_OUTPUT
          echo "version_doi=$(echo "$OUT" | python -c 'import sys,json; print(json.load(sys.stdin)["version_doi"])')" >> $GITHUB_OUTPUT
          echo "record_url=$(echo "$OUT" | python -c 'import sys,json; print(json.load(sys.stdin)["record_url"])')" >> $GITHUB_OUTPUT

      - name: Write version sidecar into repo
        env:
          ISSUED_DATE: ${{ steps.zenodo.outputs.issued }}
        run: |
          python .scripts/src/write_version_sidecar.py \
            "${{ steps.pick.outputs.md }}" \
            "${{ steps.zenodo.outputs.version_doi }}" \
            "${{ steps.zenodo.outputs.concept_doi }}" \
            "${{ steps.zenodo.outputs.record_url }}"

      - name: Push artifacts+provenance to siran/assets
        env: { ASSETS_PAT: ${{ secrets.ASSETS_PAT }} }
        run: |
          set -e
          TITLE="$(python - <<'PY'
from pathlib import Path
p=Path(r"""${{ steps.pick.outputs.md }}""")
with p.open("r", encoding="utf-8") as f:
    first=f.readline().strip()
print(first[2:].strip() if first.startswith("% ") else p.stem)
PY
)"
          VERSION_DOI="${{ steps.zenodo.outputs.version_doi }}"
          DOI_SAFE="${VERSION_DOI//\//_}"

          SRC_DIR="$(dirname "${{ steps.pick.outputs.md }}")"
          git config --global user.name  "preferredframe-bot"
          git config --global user.email "bot@preferredframe.com"

          git clone "https://${ASSETS_PAT}@github.com/siran/assets.git" assets
          DEST_DIR="preferredframe/$TITLE/$DOI_SAFE"
          mkdir -p "assets/$DEST_DIR"

          cp "${{ steps.pick.outputs.pdf }}"       "assets/$DEST_DIR/${TITLE}.pdf"
          cp "${{ steps.pick.outputs.html }}"      "assets/$DEST_DIR/${TITLE}.html"
          cp "${SRC_DIR}/source.yml"               "assets/$DEST_DIR/source.yml"
          cp "${SRC_DIR}/versions/${DOI_SAFE}.yml" "assets/$DEST_DIR/${DOI_SAFE}.yml"

          cd assets
          git add "$DEST_DIR"
          git commit -m "Publish \"$TITLE\" — ${VERSION_DOI} (primary: .md)"
          git push
