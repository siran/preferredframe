name: print

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]
    paths:
      - 'preferredframe/prints/**/*.md'

jobs:
  print:
    if: ${{ github.repository_owner == 'preferredframe' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pandoc + crossref + minimal TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc pandoc-crossref texlive-xetex texlive-fonts-recommended texlive-plain-generic

      - name: Build, verify, write sidecar, push assets
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_SHA: ${{ github.sha }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          python ./.scripts/src/print_pipeline.py

      - name: Upload print artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-assets
          path: |
            preferredframe/prints/**/*.pnp.md
            preferredframe/prints/**/*.html
            preferredframe/prints/**/*.pdf
            preferredframe/prints/**/print.json
          if-no-files-found: warn
