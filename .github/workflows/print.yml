name: PNPMD to Zenodo (push)

on:
  push:
    paths:
      - "preferredframe/prints/**/*.md"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: pandoc/latex:latest
    defaults:
      run:
        shell: sh
    permissions:
      contents: read
    env:
      ZENODO_API: https://sandbox.zenodo.org/api
      BASE_URL: https://preferredframe.com

    steps:
      - name: Ensure git, curl, python, pip (before checkout)
        run: |
          set -eu
          have() { command -v "$1" >/dev/null 2>&1; }
          install_pkgs() {
            if have apt-get; then
              apt-get update -y
              apt-get install -y git curl python3 python3-venv python3-pip
            elif have apk; then
              apk add --no-cache git curl python3 py3-pip py3-virtualenv
            elif have microdnf; then
              microdnf install -y git curl python3 python3-pip || microdnf install -y git curl python3
            elif have dnf; then
              dnf install -y git curl python3 python3-pip || dnf install -y git curl python3
            elif have yum; then
              yum install -y git curl python3 python3-pip || yum install -y git curl python3
            elif have zypper; then
              zypper --non-interactive install git curl python3 python3-pip || zypper --non-interactive install git curl python3
            else
              echo "No supported package manager found." >&2
              exit 1
            fi
          }
          have git && have python3 || install_pkgs
          # bootstrap pip if missing
          if ! have pip3; then
            curl -fsSL https://bootstrap.pypa.io/get-pip.py | python3
          fi
          git --version
          python3 --version
          pip3 --version

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create venv and install Python deps (PEP 668-safe)
        run: |
          set -eu
          python3 -m venv /tool_venv
          . /tool_venv/bin/activate
          pip install --upgrade pip
          pip install requests pyyaml
          echo "PY=/tool_venv/bin/python" >> "$GITHUB_ENV"
          echo "PIP=/tool_venv/bin/pip"   >> "$GITHUB_ENV"
          $PY -V
          $PIP -V

      - name: Install pandoc-crossref
        run: |
          set -eu
          VER=0.3.17.0
          if ! command -v curl >/dev/null 2>&1; then
            # Should already be present, but safeguard:
            if command -v apt-get >/dev/null 2>&1; then apt-get update -y && apt-get install -y curl;
            elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl;
            elif command -v dnf >/dev/null 2>&1; then dnf install -y curl;
            elif command -v yum >/dev/null 2>&1; then yum install -y curl;
            elif command -v zypper >/dev/null 2>&1; then zypper --non-interactive install curl;
            elif command -v microdnf >/dev/null 2>&1; then microdnf install -y curl;
            else echo "No package manager to install curl"; exit 1; fi
          fi
          curl -fsSL -o xref.tar.xz "https://github.com/lierdakil/pandoc-crossref/releases/download/v$VER/pandoc-crossref-Linux.tar.xz"
          tar -xJf xref.tar.xz
          install -m 0755 pandoc-crossref /usr/local/bin/pandoc-crossref
          pandoc-crossref --version

      - name: Run print pipeline (push → build → Zenodo)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BEFORE:     ${{ github.event.before }}
          GITHUB_AFTER:      ${{ github.sha }}
          ASSETS_PAT:        ${{ secrets.ASSETS_PAT }}
          ZENODO_TOKEN:      ${{ secrets.ZENODO_TOKEN }}
          ZENODO_API:        ${{ env.ZENODO_API }}
          BASE_URL:          ${{ env.BASE_URL }}
        run: |
          set -eu
          $PY .scripts/src/print_pipeline.py
