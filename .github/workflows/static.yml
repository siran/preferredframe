name: Build & deploy site

on:
  push:
    branches: [ main ]
    paths:
      - 'prints/**'
      - 'src/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          echo "Building for $OWNER/$NAME on $GITHUB_REF_NAME"
          GITHUB_USER="$OWNER" REPO_NAME="$NAME" GH_BRANCH="$GITHUB_REF_NAME" \
          CUSTOM_BASE_URL="https://preferredframe.com" \
            python3 src/build_site.py

      - name: Inspect output
        run: |
          head -n 50 site/index.html || true
          grep -n "preferredframe.com" -R site || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
